# Nav2 settings for LUCIA (Roomba 650 base, RPLidar on top, slam_toolbox map).
#
# Started by launch/navigation.launch.py. Only these four Nav2 servers run:
# planner (finds a path on the map), controller (follows it), behaviors
# (recoveries: spin, back up, wait) and bt_navigator (the navigate_to_pose
# action that ties them together). No velocity smoother: the controller
# publishes /cmd_vel to roomba_bridge (through safety_gate), and roomba_bridge
# ramps every speed change itself (max_linear_accel etc.), for all drivers.
#
# Based on Nav2 Jazzy's nav2_params.yaml, cut down and slowed down.
#
# Robot size: 18 in (0.46 m) edge to edge with the arm and Pi drawer, measured
# 2026-10-17, so robot_radius 0.23. The same size is also in the mission node's
# clearance_m (lucia_nav/mission.py) and web_ui's robot_radius_m (the drawing).
#
# Speed: desired_linear_vel is only the default. The web page's speed slider
# overrides it through Nav2's speed_limit topic (lucia_web/web_ui.py). Both
# start at the top speed, 0.30 m/s (roomba_bridge's limit); lucia_bringup's
# safety_gate slows it down in tight spaces, from the lidar, for every driver.
# The cost-based slowdown below (center within 0.4 m of an obstacle) adds to it.
#
# Runs on the Pi: Explore worked on the robot 2026-10-17 (after allow_unknown: false).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # Default behavior tree: replan once a second, recover by clearing the
    # costmaps, spinning 90 deg, waiting 5 s, backing up 0.3 m.

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odom
    # Jazzy reads the plural *_plugins keys; the singular one is for older Nav2.
    progress_checker_plugins: ["progress_checker"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Give up on a goal (and let the behavior tree recover) if the robot
    # hasn't moved 0.3 m in 15 s. Slow robot, turns in place: be patient.
    # This watches the odom frame, which is open-loop (commanded speed), so it
    # can't tell when the robot is stuck; the mission node's stuck check
    # (lucia_nav/motion_check.py, from the lidar and IMU) does that.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.4       # ~23 deg; frontier goals don't need an exact heading

    # Regulated Pure Pursuit: follows the path, turns in place first when the
    # path starts off to the side, slows down near obstacles and at the goal.
    # A good fit for a differential-drive robot this simple.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30      # top speed; safety_gate slows it in tight spaces
      # Look ahead 1.5 s of travel, kept between 0.25 and 0.7 m (lookahead_dist
      # is only used when scaling is off). Slow in a tight space (safety_gate),
      # it aims 0.25 m ahead: it cuts corners less, and the collision check
      # below, which looks no further than that point, stops flagging a door
      # frame it would pass. At 30 cm/s in the open: 0.45 m. Was a fixed 0.4 m
      # until 2026-10-23, when tight spaces stuttered.
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0     # same as the costmaps' inflation layer
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 2.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      # Plan over mapped floor only. With true, it planned routes through unseen
      # space when the mapped way was blocked, e.g. out of a gap in the wall and
      # around the outside of the room (first run, 2026-10-16), and the robot got
      # stuck. Frontier goals are mapped floor cells, so they're still reachable.
      allow_unknown: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

# Small map around the robot, from the lidar only, for steering.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.23            # 18 in across, measured 2026-10-17
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45        # robot radius + ~0.2 m where paths get more expensive
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

# The whole map, from slam_toolbox's /map plus the lidar, for planning.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.23            # same as the local costmap
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45        # robot radius + ~0.2 m where paths get more expensive
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
