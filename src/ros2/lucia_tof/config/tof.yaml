tof_node:
  ros__parameters:
    port: /dev/imu              # the sensor Pico (ToF + IMU); see udev/99-lucia-tof.rules
    baud: 115200                # ignored over USB serial
    sensor_names: [left, middle, right]   # src/pico2/main.py SENSORS order
    frame_id_prefix: tof_       # frames are tof_<name>_link
    flip_h: false               # mirror each image left/right
    flip_v: false               # mirror each image top/bottom
    max_range: 4.0              # m, Range.max_range
    stale_timeout: 0.5          # s without a frame before tof/near goes true
    near_rate: 10.0             # Hz, tof/near is also sent on every frame
    # Near = something in the robot's path (lucia_tof/zones.py, where the sensors sit):
    stop_distance_m: 0.15       # this far past the front of the Roomba (the page's "ToF stop distance")
    front_m: 0.17               # front of the Roomba from its middle (34 cm across)
    half_width_m: 0.25          # its path: robot radius + 2 cm each side of the middle
    z_min_m: 0.02               # lower = the floor
    z_max_m: 0.45               # higher = it passes under
    radial: true                # readings along each zone's line of sight (not yet checked)
    near_frames: 3              # frames in a row before a sensor's answer changes (~50 ms)
    min_range_mm: 20            # closer readings are glitches, unless half the zones agree
    near_mm: 300                # only for sensors zones.py doesn't know: closer than this = near
    publish_imu: true           # IMU readings on imu/data (mapping.launch.py sets this from use_imu)
    imu_frame_id: imu_link
    orientation_variance: 0.0025          # about 3 deg; rough, not measured (same as imu_bridge)
    angular_velocity_variance: 0.0004     # about 1 deg/s
    linear_acceleration_variance: 0.01    # not fused by the EKF
    imu_warn_s: 1.0             # s without an IMU reading before it warns
    # The robot's IMU is mounted upside down (chip side down; it read gravity as
    # -9.87 m/s^2 on its z axis, 2026-11-10), so its readings are turned over.
    # With src/pico2/main.py, gravity decides this by itself and a mismatch is
    # logged; stream_main.py sends no acceleration, so then this value decides.
    imu_upside_down: true
