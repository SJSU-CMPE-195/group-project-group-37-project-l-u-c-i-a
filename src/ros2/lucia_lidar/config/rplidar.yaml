# Connection settings for the RPLidar A2M8, used by the rplidar_ros package's
# rplidar_node. Values below come from how the lidar was actually run last
# semester (src/scripts/lidar_reader.py, lucia.service) - not guesses.
#
# Usage once a launch file exists:
#   ros2 launch rplidar_ros rplidar_a2m8_launch.py --ros-args --params-file config/rplidar.yaml
# Or test directly:
#   ros2 run rplidar_ros rplidar_node --ros-args --params-file config/rplidar.yaml

rplidar_node:
  ros__parameters:
    serial_port: /dev/rplidar       # udev symlink; was already in use for months via lucia.service
    serial_baudrate: 115200         # A2M8 default (lidar_reader.py)
    frame_id: laser                 # matters once the TF tree is set up; not yet
    inverted: false
    angle_compensate: true
    scan_mode: Standard
